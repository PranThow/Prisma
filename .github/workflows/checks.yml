name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check source layers
        run: sh scripts/check-layers.sh tweak/Sources
      - name: Check build script syntax
        run: bash -n scripts/pipeline.sh scripts/install.sh

  artwork:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [animated-artwork, canvas, artwork-video, apple-music-artwork]
    steps:
      - uses: actions/checkout@v5
      - name: Run artwork harness
        run: sh harness/${{ matrix.harness }}/check.sh
